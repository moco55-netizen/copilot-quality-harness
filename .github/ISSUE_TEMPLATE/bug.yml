name: Bug
description: 再現可能な不具合
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: reproduction
    attributes: { label: 再現手順, description: 手順・実際の結果・期待結果 }
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes: { label: 受入条件, description: 修正後に期待する動作 }
    validations: { required: true }
  - type: textarea
    id: scope
    attributes: { label: 影響範囲, description: Frontend/Backend/API/DB/Infra/Docs }
    validations: { required: true }
  - type: dropdown
    id: severity
    attributes:
      label: リスク
      options: ["low", "medium", "high", "critical"]
    validations: { required: true }
  - type: textarea
    id: test
    attributes: { label: テスト要求, description: 必須観点と未実施理由 }
    validations: { required: true }
